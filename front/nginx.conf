server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA shell — index.html must never be cached, otherwise WebViews keep
    # pointing at a stale bundle hash. Bundles themselves are content-hashed
    # by Vite (e.g. assets/index-<hash>.js) so they're safe to cache forever.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri =404;
    }

    # SPA: все маршруты -> index.html
    location / {
        # Same no-cache for SPA navigations that fall back to index.html.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable — cache aggressively.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://back:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket
    location /ws {
        proxy_pass http://back:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy uploaded files
    location /uploads/ {
        proxy_pass http://back:8080/uploads/;
    }
}
