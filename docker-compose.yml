services:
  # Self-signed certificate for a local run; skipped when nginx/certs already has cert.crt + cert.key.
  certs:
    image: alpine:3.20
    command: >
      /bin/sh -c "[ -s /certs/cert.crt ] && [ -s /certs/cert.key ] && exit 0;
      apk add --no-cache openssl >/dev/null &&
      openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj /CN=$${DOMAIN:-localhost}
      -keyout /certs/cert.key -out /certs/cert.crt"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./nginx/certs:/certs

  nginx:
    image: nginx:1.27-alpine
    command: >
      /bin/sh -c "envsubst '$$DOMAIN' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      back:
        condition: service_healthy
      front:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: join-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-join_db}
      POSTGRES_USER: ${POSTGRES_USER:-join_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-join_user} -d ${POSTGRES_DB:-join_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  back:
    build: ./back
    container_name: join-back
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-join_db}
      DB_USERNAME: ${POSTGRES_USER:-join_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      MAX_WEBHOOK_URL: ${MAX_WEBHOOK_URL:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-https://${DOMAIN:-localhost}}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://${DOMAIN:-localhost}}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.aiproductiv.ru/v1}
      AI_MODEL: ${AI_MODEL:-gpt-6-luna}
      JOIN_CITIES: ${JOIN_CITIES:-Москва,Санкт-Петербург,Новосибирск,Екатеринбург,Казань,Нижний Новгород,Красноярск,Челябинск,Самара,Уфа,Ростов-на-Дону,Краснодар,Омск,Воронеж,Пермь,Волгоград}
      CULTURE_RU_API_KEY: ${CULTURE_RU_API_KEY:-}
      TICKETTOSHOW_REF_CODE: ${TICKETTOSHOW_REF_CODE:-}
      TICKETTOSHOW_UTM_QUERY: ${TICKETTOSHOW_UTM_QUERY:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_DAYS: ${JWT_TTL_DAYS:-30}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      # The JRE image has no curl; bash talks to the port directly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.[01] 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: ./front
      args:
        VITE_API_URL: /api
    container_name: join-front
    depends_on:
      - back
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        VITE_ADMIN_API_URL: /api/admin
    container_name: join-admin
    ports:
      - "${ADMIN_PORT:-8081}:80"
    depends_on:
      - back
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
