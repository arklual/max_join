databaseChangeLog:
  - changeSet:
      id: 034-create-friend-group-chat-messages-table
      author: junior1
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: friend_group_chat_messages
      changes:
        - createTable:
            tableName: friend_group_chat_messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: friend_group_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_friend_group_chat_messages_group_id
                    references: friend_groups(id)
              - column:
                  name: sender_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_friend_group_chat_messages_sender_id
                    references: users(id)
              - column:
                  name: text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: friend_group_chat_messages
            indexName: idx_friend_group_chat_messages_group_created
            columns:
              - column:
                  name: friend_group_id
              - column:
                  name: created_at
      rollback:
        - dropTable:
            tableName: friend_group_chat_messages
