databaseChangeLog:
  - changeSet:
      id: 014-create-support-messages-table
      author: junior1
      changes:
        - createTable:
            tableName: support_messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticket_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_support_messages_ticket_id
                    references: support_tickets(id)
              - column:
                  name: sender_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - createIndex:
            tableName: support_messages
            indexName: idx_support_messages_ticket_id
            columns:
              - column:
                  name: ticket_id
