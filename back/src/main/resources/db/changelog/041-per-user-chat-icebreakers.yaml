databaseChangeLog:
  - changeSet:
      id: 041-per-user-chat-icebreakers
      author: join-team
      comment: >
        Icebreakers were cached per chat, so the second participant got suggestions
        written for the first one (addressing themselves by name). They are now
        cached per (chat, user). The old table only held a regenerable cache.
      changes:
        - createTable:
            tableName: chat_user_icebreakers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_chat_user_icebreakers_chat
                    references: chats(id)
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_chat_user_icebreakers_user
                    references: users(id)
              - column:
                  name: suggestions
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addUniqueConstraint:
            tableName: chat_user_icebreakers
            columnNames: chat_id, user_id
            constraintName: uq_chat_user_icebreakers
        - dropTable:
            tableName: chat_icebreakers
