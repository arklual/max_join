databaseChangeLog:
  - changeSet:
      id: 019-create-group-chats-table
      author: junior1
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: group_chats
      changes:
        - createTable:
            tableName: group_chats
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_group_chats_group_id
                    references: group_gatherings(id)
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_group_chats_event_id
                    references: events(id)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: group_chats
