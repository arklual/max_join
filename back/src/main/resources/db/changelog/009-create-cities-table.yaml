databaseChangeLog:
  - changeSet:
      id: 009-create-cities-table
      author: join-team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: cities
      changes:
        - createTable:
            tableName: cities
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 009-insert-cities-data
      author: join-team
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM cities
