databaseChangeLog:
  - changeSet:
      id: 025-insert-universities-data
      author: join-team
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: universities
      changes:
        - sql:
            sql: |
              INSERT INTO universities (name, city)
              SELECT seed.name, seed.city
              FROM (
                  VALUES
                      ('МГУ имени М.В. Ломоносова', 'Москва'),
                      ('МГТУ имени Н.Э. Баумана', 'Москва'),
                      ('СПбГУ', 'Санкт-Петербург'),
                      ('ИТМО', 'Санкт-Петербург'),
                      ('КФУ', 'Казань'),
                      ('КНИТУ-КАИ', 'Казань'),
                      ('НГУ', 'Новосибирск'),
                      ('НГТУ', 'Новосибирск'),
                      ('УрФУ', 'Екатеринбург'),
                      ('УрГЭУ', 'Екатеринбург'),
                      ('ННГУ имени Н.И. Лобачевского', 'Нижний Новгород'),
                      ('НГТУ имени Р.Е. Алексеева', 'Нижний Новгород'),
                      ('ЮУрГУ', 'Челябинск'),
                      ('ЧелГУ', 'Челябинск'),
                      ('Самарский университет', 'Самара'),
                      ('СамГТУ', 'Самара'),
                      ('ОмГУ имени Ф.М. Достоевского', 'Омск'),
                      ('ОмГТУ', 'Омск'),
                      ('ЮФУ', 'Ростов-на-Дону'),
                      ('ДГТУ', 'Ростов-на-Дону'),
                      ('УУНиТ', 'Уфа'),
                      ('УГНТУ', 'Уфа'),
                      ('СФУ', 'Красноярск'),
                      ('КрасГМУ', 'Красноярск'),
                      ('ВГУ', 'Воронеж'),
                      ('ВГТУ', 'Воронеж'),
                      ('ПГНИУ', 'Пермь'),
                      ('ПНИПУ', 'Пермь'),
                      ('ВолГУ', 'Волгоград'),
                      ('ВолгГТУ', 'Волгоград'),
                      ('КубГУ', 'Краснодар'),
                      ('КубГТУ', 'Краснодар'),
                      ('ТюмГУ', 'Тюмень'),
                      ('ТИУ', 'Тюмень'),
                      ('СГУ имени Н.Г. Чернышевского', 'Саратов'),
                      ('СГТУ имени Гагарина Ю.А.', 'Саратов'),
                      ('ТГУ', 'Тольятти'),
                      ('Поволжский православный институт', 'Тольятти'),
                      ('УдГУ', 'Ижевск'),
                      ('ИжГТУ имени М.Т. Калашникова', 'Ижевск')
              ) AS seed(name, city)
              WHERE NOT EXISTS (
                  SELECT 1
                  FROM universities u
                  WHERE u.name = seed.name
                    AND u.city = seed.city
              );
