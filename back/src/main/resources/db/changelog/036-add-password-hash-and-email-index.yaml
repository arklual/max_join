databaseChangeLog:
  - changeSet:
      id: 036-add-password-hash-and-email-index
      author: join-team
      preConditions:
        - onFail: HALT
          and:
            - tableExists:
                tableName: users
            - columnExists:
                tableName: users
                columnName: email
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
        - createIndex:
            tableName: users
            indexName: ux_users_email
            unique: true
            columns:
              - column:
                  name: email
      rollback:
        - dropIndex:
            tableName: users
            indexName: ux_users_email
        - dropColumn:
            tableName: users
            columnName: password_hash
