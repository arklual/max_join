databaseChangeLog:
  - changeSet:
      id: 004-create-user-interests-table
      author: join-team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_interests
      changes:
        - createTable:
            tableName: user_interests
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: interest
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_interests
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_interests_user_id
