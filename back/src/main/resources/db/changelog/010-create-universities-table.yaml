databaseChangeLog:
  - changeSet:
      id: 010-create-universities-table
      author: junior2
      changes:
        - createTable:
            tableName: universities
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_universities_city
            tableName: universities
            columns:
              - column:
                  name: city
