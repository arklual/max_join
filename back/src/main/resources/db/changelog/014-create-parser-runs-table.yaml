databaseChangeLog:
  - changeSet:
      id: 014-create-parser-runs-table
      author: join-team
      changes:
        - createTable:
            tableName: parser_runs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_parser_runs
              - column:
                  name: source
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: finished_at
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(20)
                  remarks: "RUNNING, SUCCESS, PARTIAL, FAILED"
              - column:
                  name: events_found
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: events_created
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: events_updated
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: events_skipped
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: trigger_type
                  type: VARCHAR(20)
                  remarks: "SCHEDULED, MANUAL"
