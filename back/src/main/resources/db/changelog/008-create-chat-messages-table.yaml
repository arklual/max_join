databaseChangeLog:
  - changeSet:
      id: 008-create-chat-messages-table
      author: join-team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: chat_messages
      changes:
        - createTable:
            tableName: chat_messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_chat_messages_chat
                    references: chats(id)
              - column:
                  name: sender_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_chat_messages_sender
                    references: users(id)
              - column:
                  name: text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: is_read
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValueBoolean: false

  - changeSet:
      id: 008-create-chat-messages-chat-id-index
      author: join-team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_chat_messages_chat_id
      changes:
        - createIndex:
            indexName: idx_chat_messages_chat_id
            tableName: chat_messages
            columns:
              - column:
                  name: chat_id
