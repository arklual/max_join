databaseChangeLog:
  - changeSet:
      id: 018-create-group-members-table
      author: junior1
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: group_members
      changes:
        - createTable:
            tableName: group_members
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_group_members_group_id
                    references: group_gatherings(id)
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_group_members_user_id
                    references: users(id)
              - column:
                  name: role
                  type: VARCHAR(20)
                  defaultValue: MEMBER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: left_at
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: group_members
            columnNames: group_id, user_id
            constraintName: uq_group_members_group_user
        - createIndex:
            tableName: group_members
            indexName: idx_group_members_group_id
            columns:
              - column:
                  name: group_id
        - createIndex:
            tableName: group_members
            indexName: idx_group_members_user_id
            columns:
              - column:
                  name: user_id
      rollback:
        - dropTable:
            tableName: group_members
