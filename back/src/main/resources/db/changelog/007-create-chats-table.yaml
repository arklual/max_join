databaseChangeLog:
  - changeSet:
      id: 007-create-chats-table
      author: join-team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: chats
      changes:
        - createTable:
            tableName: chats
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user1_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_chats_user1
                    references: users(id)
              - column:
                  name: user2_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_chats_user2
                    references: users(id)
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_chats_event
                    references: events(id)
              - column:
                  name: match_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_chats_match
                    references: matches(id)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
