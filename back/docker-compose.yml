version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: join-postgres
    environment:
      POSTGRES_DB: join_db
      POSTGRES_USER: join_user
      POSTGRES_PASSWORD: join_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U join_user -d join_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
